<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AIアリーナ v1（6選手・3チーム）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#bfe6f5; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; }
  #scene { position:fixed; inset:0; }
  canvas { display:block; }
  .chip {
    position:fixed; top:10px; left:10px; z-index:10;
    background:rgba(255,255,255,.92); border-radius:14px; padding:8px 12px;
    box-shadow:0 2px 10px rgba(60,80,100,.18); max-width:78vw;
  }
  .chip .title { font-size:16px; font-weight:800; color:#33424f; }
  .chip .sub { font-size:11px; color:#7a8a96; margin-top:2px; line-height:1.5; }
  .chip .sub b { color:#e08a2e; }
  #score {
    position:fixed; top:10px; right:10px; z-index:10;
    background:rgba(38,50,60,.85); color:#fff; border-radius:14px; padding:8px 12px;
    font-size:12.5px; line-height:1.7; font-weight:700; min-width:118px;
  }
  #score .s-h { color:#7fe0d4; } #score .s-g { color:#ff9d8a; } #score .s-k { color:#ffd76a; }
  #logbar {
    position:fixed; left:10px; right:10px; bottom:86px; z-index:10;
    background:rgba(38,50,60,.82); color:#fff; border-radius:12px;
    padding:8px 12px; font-size:13px; line-height:1.5; min-height:38px;
    display:flex; align-items:center; gap:8px;
  }
  #bar {
    position:fixed; left:0; right:0; bottom:0; z-index:11;
    padding:10px 10px calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    background:linear-gradient(to top, rgba(255,255,255,.85), rgba(255,255,255,0));
  }
  #bar button {
    border:none; border-radius:999px; padding:12px 16px; font-size:14px; font-weight:700;
    background:#fff; color:#33424f; box-shadow:0 2px 8px rgba(60,80,100,.22); cursor:pointer; font-family:inherit;
  }
  #bar button.on { background:#33424f; color:#fff; }
  #bar button:active { transform:scale(.96); }

    position:fixed; inset:0; z-index:15; display:none; align-items:center; justify-content:center;
    pointer-events:none;

  #winner .w {
    background:rgba(255,255,255,.95); border-radius:20px; padding:22px 30px; text-align:center;
    font-size:24px; font-weight:800; color:#33424f; box-shadow:0 8px 30px rgba(60,80,100,.3);
  }
  #winner .w small { display:block; font-size:13px; color:#7a8a96; margin-top:6px; font-weight:700; }
  #loading {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:#bfe6f5; color:#33424f; font-size:15px; font-weight:700;
  }

<body>
<div id="scene"></div>
<div id="loading">アリーナを作っています…</div>
<div class="chip">
  <div class="title">🏟️ AIアリーナ v1</div>
  <div class="sub"><b>AI選手6人・3チーム戦</b>。玉を自分のチームの陣地に入れたら得点。ギミック：スイッチ連動扉／スプリング台／氷ゾーン（選手が考えて使う）。</div>
</div>
<div id="score">

  <div class="s-g">ガンテツ組：<span id="sc-gantetsu">0</span></div>
  <div class="s-k">キツネ組：<span id="sc-kitsune">0</span></div>
</div>
<div id="winner"><div class="w"><span id="winnerText"></span><small>玉を中央に戻します</small></div></div>
<div id="logbar"><span>📣</span><span id="logtext">試合開始を待っています</span></div>
<div id="bar">
  <button id="btnPlay" class="on">⏸ 止める</button>
  <button id="btnBall">玉を中央へ</button>
  <button data-cam="all" class="cambtn on">全体</button>
  <button data-cam="center" class="cambtn">中央</button>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe6f5);
scene.fog = new THREE.Fog(0xbfe6f5, 85, 160);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 300);
camera.position.set(26, 26, 26);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.46;
controls.minDistance = 8;
controls.maxDistance = 80;

scene.add(new THREE.HemisphereLight(0xeaf7ff, 0x8fbf7a, 0.95));
const sun = new THREE.DirectionalLight(0xfff6e0, 1.6);
sun.position.set(18, 34, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
sun.shadow.camera.top = 34; sun.shadow.camera.bottom = -34;
scene.add(sun);

const mat = (c, o={}) => new THREE.MeshStandardMaterial({ color:c, roughness:0.9, metalness:0, ...o });
function box(w,h,d,c,x=0,y=0,z=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c));
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function canvasTex(w,h,draw){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function textSprite(text, { fg='#33424f', font=46, scale=1 }={}){
  const cv = document.createElement('canvas'); const ctx = cv.getContext('2d');
  ctx.font = `800 ${font}px "Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif`;
  const tw = Math.ceil(ctx.measureText(text).width);
  cv.width = tw + 36; cv.height = font + 36;
  const c2 = cv.getContext('2d');
  c2.fillStyle = 'rgba(255,255,255,0.94)';
  c2.beginPath(); c2.roundRect(0,0,cv.width,cv.height,26); c2.fill();
  c2.font = `800 ${font}px "Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif`;
  c2.fillStyle = fg; c2.textBaseline='middle'; c2.textAlign='center';
  c2.fillText(text, cv.width/2, cv.height/2+2);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true }));
  sp.scale.set(cv.width/120*scale, cv.height/120*scale, 1);
  return sp;
}

/* ============ アリーナ ============ */
const ARENA = 36;
const HALF = ARENA / 2;
const WALL_H = 2.0;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA, ARENA), mat(0x9edb77));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
{
  const ring = new THREE.Mesh(new THREE.RingGeometry(2.6, 2.85, 40),
    new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.65, side:THREE.DoubleSide }));
  ring.rotation.x = -Math.PI/2; ring.position.y = 0.02; scene.add(ring);
}
box(ARENA+1.2, WALL_H, 0.6, 0xe8e2d2, 0, WALL_H/2, -HALF-0.3);
box(ARENA+1.2, WALL_H, 0.6, 0xe8e2d2, 0, WALL_H/2,  HALF+0.3);
box(0.6, WALL_H, ARENA+1.2, 0xe8e2d2, -HALF-0.3, WALL_H/2, 0);
box(0.6, WALL_H, ARENA+1.2, 0xe8e2d2,  HALF+0.3, WALL_H/2, 0);

/* 陣地（チーム） */
const BASES = [
  { key:'hayate',   name:'ハヤテ組',   cx:-13.9, cz:-13.9, color:0x2aa198, size:7 },
  { key:'gantetsu', name:'ガンテツ組', cx: 13.9, cz:-13.9, color:0xd94f3d, size:7 },
  { key:'kitsune',  name:'キツネ組',   cx:-13.9, cz: 13.9, color:0xe0a81c, size:7 },
];
for(const b of BASES){
  const zone = new THREE.Mesh(new THREE.PlaneGeometry(b.size, b.size),
    new THREE.MeshStandardMaterial({ color:b.color, transparent:true, opacity:0.4, roughness:1 }));
  zone.rotation.x = -Math.PI/2; zone.position.set(b.cx, 0.03, b.cz);
  zone.receiveShadow = true; scene.add(zone);
  const label = textSprite(b.name, { fg:'#33424f', font:40, scale:0.8 });
  label.position.set(b.cx, 3.4, b.cz); scene.add(label);
}
const baseOfTeam = (team) => BASES.find(b => b.key === team);

/* 障害物：厚いブロック主体（薄壁は最小限） */
const BOXES = [
  { x:-6,   z:-9,  w:4.4, d:2.2 },
  { x: 7,   z:-7,  w:2.2, d:5.0 },
  { x:-10,  z: 3,  w:2.2, d:4.4 },
  { x: 10,  z: 5,  w:4.4, d:2.2 },
  { x: 4,   z: 11, w:2.2, d:4.4 },
  { x:-3,   z:-14, w:2.2, d:3.6 },
  { x: 13,  z:-13, w:3.6, d:2.2 },
  { x:-14,  z: 8,  w:3.6, d:2.2 },
  { x: 7,   z:-14, w:3.0, d:2.2 },
  { x:-8,   z: 13, w:3.0, d:2.2 },
  { x: 14,  z: 12, w:2.2, d:3.0 },
  { x:-13,  z:-3,  w:2.6, d:2.6 },
  /* 中央壁（扉の両脇） */
  { x:-3.9, z: 2,   w:5.2, d:2.2 },
  { x: 3.9, z: 2,   w:5.2, d:2.2 },
  /* 薄壁はアクセントに2枚だけ */
  { x: 1,   z:-6,  w:0.9, d:3.6 },
  { x:-6,   z: 7,  w:3.6, d:0.9 },
];
for(const o of BOXES){
  box(o.w, 1.3, o.d, 0xd9cfb8, o.x, 0.65, o.z);
  box(o.w, 0.2, o.d, 0xbfb096, o.x, 1.4, o.z);
}
const PILLARS = [
  { x: 12, z:-3, r:1.15 },
  { x: -2, z: 6, r:1.15 },
  { x: 3,  z:-11, r:1.15 },
];
for(const p of PILLARS){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(p.r, p.r * 1.08, 1.7, 18), mat(0xcdbfa3));
  m.position.set(p.x, 0.85, p.z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(p.r * 1.12, p.r * 1.12, 0.22, 18), mat(0xbfb096));
  cap.position.set(p.x, 1.8, p.z); cap.castShadow = true; scene.add(cap);
}
/* 円の押し出し解決（箱＋柱＋扉）。戻り値：補正後の {x, z, hit} */
function resolveCircle(x, z, r){
  let hit = false;
  for(const o of BOXES){
    const hw = o.w/2, hd = o.d/2;
    const cx = Math.max(o.x - hw, Math.min(o.x + hw, x));
    const cz = Math.max(o.z - hd, Math.min(o.z + hd, z));
    let dx = x - cx, dz = z - cz;
    const d2 = dx*dx + dz*dz;
    if(d2 < r*r){
      hit = true;
      if(d2 > 1e-6){
        const d = Math.sqrt(d2); x = cx + dx/d * r; z = cz + dz/d * r;
      } else {
        const px = hw + r - Math.abs(x - o.x), pz = hd + r - Math.abs(z - o.z);
        if(px < pz) x = o.x + Math.sign(x - o.x || 1) * (hw + r);
        else z = o.z + Math.sign(z - o.z || 1) * (hd + r);
      }
    }
  }
  for(const p of PILLARS){
    let dx = x - p.x, dz = z - p.z;
    const rr = p.r + r, d2 = dx*dx + dz*dz;
    if(d2 < rr*rr && d2 > 1e-6){
      hit = true;
      const d = Math.sqrt(d2); x = p.x + dx/d * rr; z = p.z + dz/d * rr;
    }
  }
  if(doorClosed()){
    const o = DOOR;
    const hw = o.w/2, hd = o.d/2;
    const cx = Math.max(o.x - hw, Math.min(o.x + hw, x));
    const cz = Math.max(o.z - hd, Math.min(o.z + hd, z));
    let dx = x - cx, dz = z - cz;
    const d2 = dx*dx + dz*dz;
    if(d2 < r*r){
      hit = true;
      if(d2 > 1e-6){ const d = Math.sqrt(d2); x = cx + dx/d * r; z = cz + dz/d * r; }
      else z = o.z + Math.sign(z - o.z || 1) * (hd + r);
    }
  }
  return { x, z, hit };
}

/* スイッチ連動扉 */
const DOOR = { x:0, z:2, w:2.6, d:0.6, open:0 };
const doorMesh = box(DOOR.w, 1.9, DOOR.d, 0x7f9db9, DOOR.x, 0.95, DOOR.z);
box(0.35, 2.3, 0.9, 0x5a7186, -1.5, 1.15, DOOR.z);
box(0.35, 2.3, 0.9, 0x5a7186,  1.5, 1.15, DOOR.z);
{
  const s = textSprite('スイッチで開く扉', { fg:'#46617a', font:36, scale:0.7 });
  s.position.set(0, 3.1, DOOR.z); scene.add(s);
}
const SWITCH = { x:0, z:-5.5, r:1.5, pressed:false };
const switchMesh = new THREE.Mesh(new THREE.CylinderGeometry(SWITCH.r, SWITCH.r, 0.14, 24), mat(0x9aa7b1));
switchMesh.position.set(SWITCH.x, 0.07, SWITCH.z); switchMesh.receiveShadow = true; scene.add(switchMesh);
function doorClosed(){ return DOOR.open < 0.5; }

/* 坂 */
const SLOPES = [
  { x: 10.5, z: 12.5, r: 4.2, dirX: -0.55, dirZ: -0.85, h: 1.1 },
  { x: -6.5, z: -3.5, r: 3.2, dirX: 0.3,   dirZ: 0.95,  h: 0.9 },
];
for(const s of SLOPES){
  const shape = new THREE.Shape();
  shape.moveTo(-3.4, 0); shape.lineTo(3.4, 0); shape.lineTo(3.4, s.h); shape.lineTo(-3.4, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 4.6, bevelEnabled: false });
  geo.translate(0, 0, -2.3);
  const m = new THREE.Mesh(geo, mat(0xd8cdb4));
  m.position.set(s.x, 0, s.z);
  m.rotation.y = Math.atan2(s.dirX, s.dirZ) + Math.PI/2;
  m.castShadow = true; m.receiveShadow = true; scene.add(m);
}

/* 氷ゾーン */
const ICE = { x:-10.5, z:-4.5, r:3.8 };
{
  const ice = new THREE.Mesh(new THREE.CircleGeometry(ICE.r, 36),
    new THREE.MeshStandardMaterial({ color:0xcfeeff, roughness:0.15, metalness:0.05 }));
  ice.rotation.x = -Math.PI/2; ice.position.set(ICE.x, 0.025, ICE.z);
  ice.receiveShadow = true; scene.add(ice);
  const rim = new THREE.Mesh(new THREE.RingGeometry(ICE.r - 0.18, ICE.r, 36),
    new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.8, side:THREE.DoubleSide }));
  rim.rotation.x = -Math.PI/2; rim.position.set(ICE.x, 0.03, ICE.z); scene.add(rim);
  const s = textSprite('氷', { fg:'#5b87a8', font:40, scale:0.7 });
  s.position.set(ICE.x, 1.6, ICE.z); scene.add(s);
}
const onIce = (x, z) => Math.hypot(x - ICE.x, z - ICE.z) < ICE.r;

/* スプリング台（3台：各チームの陣地を向く） */
const PADS = [
  { x: 9,  z:-3, dirX:-0.83, dirZ:-0.55, team:'hayate',   cd:0 },
  { x:-3,  z: 9, dirX: 0.55, dirZ:-0.83, team:'gantetsu', cd:0 },
  { x:-6,  z: 7, dirX:-0.76, dirZ: 0.66, team:'kitsune',  cd:0 },
];
for(const p of PADS){
  const grp = new THREE.Group(); grp.position.set(p.x, 0, p.z);
  const baseDisc = new THREE.Mesh(new THREE.CylinderGeometry(1.35, 1.45, 0.16, 24), mat(0x5a7186));
  baseDisc.position.y = 0.08; baseDisc.castShadow = true; baseDisc.receiveShadow = true; grp.add(baseDisc);
  const arrowTex = canvasTex(128, 128, (c)=>{
    c.fillStyle = '#ffd76a'; c.beginPath(); c.arc(64, 64, 62, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#33424f';
    c.beginPath();
    c.moveTo(64, 18); c.lineTo(96, 62); c.lineTo(74, 62); c.lineTo(74, 108);
    c.lineTo(54, 108); c.lineTo(54, 62); c.lineTo(32, 62); c.closePath(); c.fill();
  });
  const top = new THREE.Mesh(new THREE.CircleGeometry(1.28, 24),
    new THREE.MeshStandardMaterial({ map:arrowTex, roughness:0.5 }));
  top.rotation.x = -Math.PI/2; top.position.y = 0.17; grp.add(top);
  grp.rotation.y = Math.atan2(p.dirX, p.dirZ) + Math.PI;
  scene.add(grp);
  p.grp = grp;
}

/* ============ 玉 ============ */
const BALL_R = 0.95;
const ballTex = canvasTex(256, 128, (c)=>{
  c.fillStyle = '#f7f5ef'; c.fillRect(0,0,256,128);
  c.fillStyle = '#2aa198'; c.fillRect(0,0,42,128);
  c.fillStyle = '#d94f3d'; c.fillRect(85,0,42,128);
  c.fillStyle = '#e0a81c'; c.fillRect(170,0,42,128);
});
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 26, 20),
  new THREE.MeshStandardMaterial({ map:ballTex, roughness:0.45 }));
ball.castShadow = true; scene.add(ball);
const ballRing = new THREE.Mesh(new THREE.RingGeometry(1.18, 1.42, 36),
  new THREE.MeshBasicMaterial({ color:0x33424f, transparent:true, opacity:0.45, side:THREE.DoubleSide }));
ballRing.rotation.x = -Math.PI/2; ballRing.position.y = 0.04; scene.add(ballRing);
const ballState = { x:2.5, z:3.5, vx:0, vz:0 };
function resetBall(x=2.5, z=3.5){ ballState.x = x; ballState.z = z; ballState.vx = 0; ballState.vz = 0; }

/* ============ キャラクター（町のMuse型で統一） ============ */
const CH = 1.7;
function makeCharacter(colorHex){
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.55, 26, 20), mat(colorHex, { roughness:0.6 }));
  b.scale.y = 1.28; b.position.y = 0.86; b.castShadow = true; g.add(b);
  const armMat = mat(colorHex, { roughness:0.6 });
  for(const s of [-1, 1]){
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.3, 4, 10), armMat);
    arm.position.set(0.6*s, 0.82, 0); arm.rotation.z = 0.3*s; arm.castShadow = true; g.add(arm);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), armMat);
    foot.scale.set(1, 0.55, 1.25); foot.position.set(0.21*s, 0.09, 0.05); g.add(foot);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), mat(0x26221f, { roughness:0.35 }));
    eye.position.set(0.19*s, 1.22, 0.5); g.add(eye);
  }
  scene.add(g);
  return g;
}
const TEAM_COLOR = { hayate:0x2aa198, gantetsu:0xd94f3d, kitsune:0xe0a81c };
const TEAM_FG = { hayate:'#1d7a72', gantetsu:'#b03424', kitsune:'#a87c10' };
const PLAYER_DEFS = [
  { id:'hayate',   name:'ハヤテ',   team:'hayate',   role:'ace',      speed:3.9, push:17 },
  { id:'kaze',     name:'カゼ',     team:'hayate',   role:'receiver', speed:3.6, push:13 },
  { id:'gantetsu', name:'ガンテツ', team:'gantetsu', role:'guard',    speed:3.0, push:16 },
  { id:'iwao',     name:'イワオ',   team:'gantetsu', role:'attacker', speed:3.3, push:19 },
  { id:'kitsune',  name:'キツネ',   team:'kitsune',  role:'steal',    speed:3.45, push:14 },
  { id:'kon',      name:'コン',     team:'kitsune',  role:'trick',    speed:3.4, push:14 },
];
const chars = PLAYER_DEFS.map((d, i)=>{
  const g = makeCharacter(TEAM_COLOR[d.team]);
  if(i % 2 === 1){
    /* 相方マーク：白いベルト（フォルムは変えない） */
    const belt = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.05, 10, 24), mat(0xffffff, { roughness:0.5 }));
    belt.rotation.x = Math.PI/2; belt.position.y = 0.72; g.add(belt);
  }
  const label = textSprite(d.name, { fg:TEAM_FG[d.team], scale:0.9 });
  label.position.y = CH + 0.42; g.add(label);
  return { ...d, g, vx:0, vz:0, yaw:0, smx:0, smz:0, hasSm:false, mode:'', jitter:0, jx:0, jz:0 };
});
const STARTS = {
  hayate:[-11.5,-11.5], kaze:[-9.8,-13.6],
  gantetsu:[11.5,-11.5], iwao:[9.8,-13.6],
  kitsune:[-11.5,11.5], kon:[-9.8,13.6],
};
function resetChars(){
  for(const c of chars){
    const [x, z] = STARTS[c.id];
    c.g.position.set(x, 0, z);
    c.vx = 0; c.vz = 0; c.hasSm = false;
    c.yaw = Math.atan2(-x, -z);
  }
}
resetChars();
const mateOf = (c) => chars.find(o => o.team === c.team && o !== c);

/* ============ ログ ============ */
const logtext = document.getElementById('logtext');
let lastLog = '', lastLogAt = 0;
function log(msg, force=false){
  const now = performance.now();
  if(!force && (msg === lastLog || now - lastLogAt < 900)) return;
  lastLog = msg; lastLogAt = now;
  logtext.textContent = msg;
}

/* ============ 移動（滑らか版：速度ベース＋回転補間） ============ */
function steer(c, tx, tz, dt){
  if(!c.hasSm){ c.smx = tx; c.smz = tz; c.hasSm = true; }
  const sm = Math.min(1, 5 * dt);
  c.smx += (tx - c.smx) * sm; c.smz += (tz - c.smz) * sm;
  const p = c.g.position;
  let dx = c.smx - p.x, dz = c.smz - p.z;
  const dist = Math.hypot(dx, dz);
  /* 他キャラとの間隔（弱めに） */
  for(const o of chars){
    if(o === c) continue;
    const ox = p.x - o.g.position.x, oz = p.z - o.g.position.z;
    const d = Math.hypot(ox, oz);
    if(d > 0.01 && d < 1.25){ dx += ox/d * 0.5; dz += oz/d * 0.5; }
  }
  const dl = Math.hypot(dx, dz) || 1; dx /= dl; dz /= dl;
  const sp = c.speed * (onIce(p.x, p.z) ? 0.85 : 1) * Math.min(1, dist / 1.1 + 0.15);
  const blend = Math.min(1, (onIce(p.x, p.z) ? 3.2 : 9) * dt);
  c.vx += (dx * sp - c.vx) * blend;
  c.vz += (dz * sp - c.vz) * blend;
  let nx = p.x + c.vx * dt, nz = p.z + c.vz * dt;
  const lim = HALF - 0.6;
  nx = Math.max(-lim, Math.min(lim, nx)); nz = Math.max(-lim, Math.min(lim, nz));
  const res = resolveCircle(nx, nz, 0.55);
  p.x = res.x; p.z = res.z;
  const spd = Math.hypot(c.vx, c.vz);
  if(spd > 0.4){
    const targetYaw = Math.atan2(c.vx, c.vz);
    let diff = targetYaw - c.yaw;
    while(diff > Math.PI) diff -= Math.PI * 2;
    while(diff < -Math.PI) diff += Math.PI * 2;
    c.yaw += diff * Math.min(1, 7 * dt);
  }
  c.g.rotation.y = c.yaw;
}

/* ============ 選手の思考 ============ */
const distToBase = (b, base) => Math.hypot(b.x - base.cx, b.z - base.cz);
function standPoint(c, targetBase){
  const b = ballState;
  let ax = b.x - targetBase.cx, az = b.z - targetBase.cz;
  const al = Math.hypot(ax, az) || 1; ax /= al; az /= al;
  return { x: b.x + ax * (BALL_R + 0.62), z: b.z + az * (BALL_R + 0.62) };
}
let ballStillTime = 0;
function decideTarget(c){
  const b = ballState;
  const base = baseOfTeam(c.team);
  const mate = mateOf(c);
  const p = c.g.position;
  const dBall = Math.hypot(b.x - p.x, b.z - p.z);
  const mateDBall = Math.hypot(b.x - mate.g.position.x, b.z - mate.g.position.z);
  const chase = standPoint(c, base);

  if(c.role === 'guard'){
    let threat = null, threatDist = 1e9;
    for(const ob of BASES){
      if(ob.key === c.team) continue;
      const d = distToBase(b, ob);
      if(d < threatDist){ threatDist = d; threat = ob; }
    }
    if(threat && threatDist < distToBase(b, base) - 1.5){
      if(c.mode !== 'block') log('ガンテツ：' + threat.name + 'の攻めを警戒、進路を塞ぐ');
      c.mode = 'block';
      let fx = threat.cx - b.x, fz = threat.cz - b.z;
      const fl = Math.hypot(fx, fz) || 1;
      return { x: b.x + fx/fl * (BALL_R + 0.55), z: b.z + fz/fl * (BALL_R + 0.55) };
    }
    c.mode = 'shadow';
    if(dBall < 2.2) return chase;
    return { x: (b.x + threat.cx) / 2, z: (b.z + threat.cz) / 2 };
  }

  if(c.role === 'receiver'){
    /* スイッチ係：扉の向こうに玉と自陣が分かれていて、相方が玉に近い時はスイッチへ */
    const opposite = Math.sign(b.z - DOOR.z) !== Math.sign(base.cz - DOOR.z);
    if(doorClosed() && opposite && Math.abs(b.x) < 7 && mateDBall < dBall){
      if(c.mode !== 'switch') log(c.name + '：扉を開けるためスイッチに向かう');
      c.mode = 'switch';
      return { x: SWITCH.x, z: SWITCH.z };
    }
    if(dBall < 2.4){ c.mode = 'chase'; return chase; }
    c.mode = 'receive';
    const px = b.x + b.vx * 0.6, pz = b.z + b.vz * 0.6;
    let ax = px - base.cx, az = pz - base.cz;
    const al = Math.hypot(ax, az) || 1;
    return { x: px + ax/al * (BALL_R + 1.7), z: pz + az/al * (BALL_R + 1.7) };
  }

  if(c.role === 'steal'){
    for(const ob of BASES){
      if(ob.key === c.team) continue;
      if(distToBase(b, ob) < 4.4){
        if(c.mode !== 'steal') log('キツネ：' + ob.name + 'の目前の玉をかっさらいに来た');
        c.mode = 'steal';
        let ax = b.x - ob.cx, az = b.z - ob.cz;
        const al = Math.hypot(ax, az) || 1; ax /= al; az /= al;
        return { x: b.x - ax * (BALL_R + 0.62), z: b.z - az * (BALL_R + 0.62) };
      }
    }
    c.mode = 'chase';
    return { x: chase.x + (b.z - base.cz) * 0.06, z: chase.z - (b.x - base.cx) * 0.06 };
  }

  if(c.role === 'trick'){
    const pad = PADS.find(q => q.team === c.team);
    const dPad = Math.hypot(b.x - pad.x, b.z - pad.z);
    if(pad.cd <= 0 && dPad < 8.5 && dBall < mateDBall + 1.5){
      if(c.mode !== 'pad') log('コン：スプリング台に玉を乗せようとしている');
      c.mode = 'pad';
      let ax = b.x - pad.x, az = b.z - pad.z;
      const al = Math.hypot(ax, az) || 1;
      return { x: b.x + ax/al * (BALL_R + 0.6), z: b.z + az/al * (BALL_R + 0.6) };
    }
    if(onIce(b.x, b.z) && Math.hypot(b.vx, b.vz) > 1){
      c.mode = 'ice';
      const sp = Math.hypot(b.vx, b.vz);
      return { x: b.x + b.vx/sp * Math.min(5, sp * 1.1), z: b.z + b.vz/sp * Math.min(5, sp * 1.1) };
    }
    c.mode = 'support';
    if(dBall < mateDBall) return chase;
    let ax = b.x - base.cx, az = b.z - base.cz;
    const al = Math.hypot(ax, az) || 1; ax /= al; az /= al;
    return { x: b.x - az * 2.6, z: b.z + ax * 2.6 };
  }

  /* ace / attacker */
  c.mode = 'chase';
  if(onIce(b.x, b.z) && Math.hypot(b.vx, b.vz) > 1.5){
    const sp = Math.hypot(b.vx, b.vz);
    return { x: b.x + b.vx/sp * 2.2, z: b.z + b.vz/sp * 2.2 };
  }
  return chase;
}
function stepChars(dt){
  const b = ballState;
  const speed = Math.hypot(b.vx, b.vz);
  ballStillTime = speed < 0.25 ? ballStillTime + dt : 0;
  for(const c of chars){
    c.jitter -= dt;
    if(c.jitter <= 0){ c.jitter = 2.5 + Math.random() * 2; c.jx = (Math.random()-0.5) * 2.2; c.jz = (Math.random()-0.5) * 2.2; }
    const t = decideTarget(c);
    steer(c, t.x + (ballStillTime > 5 ? c.jx : 0), t.z + (ballStillTime > 5 ? c.jz : 0), dt);
    const p = c.g.position;
    const dBall = Math.hypot(b.x - p.x, b.z - p.z);
    if(dBall < BALL_R + 0.6){
      let px = b.x - p.x, pz = b.z - p.z;
      const pl = Math.hypot(px, pz) || 1; px /= pl; pz /= pl;
      const approach = c.vx * px + c.vz * pz;
      if(approach > -0.3){
        b.vx += px * c.push * dt; b.vz += pz * c.push * dt;
        const sp = Math.hypot(b.vx, b.vz), max = 10;
        if(sp > max){ b.vx *= max/sp; b.vz *= max/sp; }
        log(c.name + ' が玉を押している');
      }
    }
  }
}

/* ============ 玉とギミックの更新 ============ */
const scores = { hayate:0, gantetsu:0, kitsune:0 };
let winFreeze = 0;
function declareWin(base){
  scores[base.key]++;
  document.getElementById('sc-' + base.key).textContent = scores[base.key];
  document.getElementById('winnerText').textContent = '🏆 ' + base.name + ' の得点！';
  document.getElementById('winner').style.display = 'flex';
  log(base.name + ' が玉を自陣に入れました', true);
  winFreeze = 2.6;
}
function stepBall(dt){
  const b = ballState;
  for(const s of SLOPES){
    if(Math.hypot(b.x - s.x, b.z - s.z) < s.r){
      b.vx += s.dirX * 2.4 * dt; b.vz += s.dirZ * 2.4 * dt;
    }
  }
  const fr = Math.exp(-(onIce(b.x, b.z) ? 0.12 : 1.05) * dt);
  b.vx *= fr; b.vz *= fr;
  const ox = b.x, oz = b.z;
  b.x += b.vx * dt; b.z += b.vz * dt;
  const lim = HALF - BALL_R;
  if(b.x < -lim){ b.x = -lim; b.vx = Math.abs(b.vx) * 0.55; }
  if(b.x >  lim){ b.x =  lim; b.vx = -Math.abs(b.vx) * 0.55; }
  if(b.z < -lim){ b.z = -lim; b.vz = Math.abs(b.vz) * 0.55; }
  if(b.z >  lim){ b.z =  lim; b.vz = -Math.abs(b.vz) * 0.55; }
  const res = resolveCircle(b.x, b.z, BALL_R * 0.92);
  if(res.hit){
    const cx = res.x - b.x, cz = res.z - b.z;
    b.x = res.x; b.z = res.z;
    if(Math.abs(cx) > Math.abs(cz)) b.vx = -b.vx * 0.5; else b.vz = -b.vz * 0.5;
    b.vx *= 0.8; b.vz *= 0.8;
  }
  for(const pad of PADS){
    if(pad.cd > 0) pad.cd -= dt;
    if(pad.cd <= 0 && Math.hypot(b.x - pad.x, b.z - pad.z) < 1.5){
      b.vx = pad.dirX * 11.5; b.vz = pad.dirZ * 11.5;
      pad.cd = 1.4;
      log('スプリング台が発射！（' + baseOfTeam(pad.team).name + 'の陣地方向）', true);
    }
  }
  ball.position.set(b.x, BALL_R, b.z);
  ballRing.position.x = b.x; ballRing.position.z = b.z;
  ball.rotation.x += b.vz * dt / BALL_R;
  ball.rotation.z -= b.vx * dt / BALL_R;
  for(const base of BASES){
    if(Math.abs(b.x - base.cx) < base.size/2 && Math.abs(b.z - base.cz) < base.size/2){
      declareWin(base);
      resetBall();
      break;
    }
  }
}
function stepGimmicks(dt){
  const wasPressed = SWITCH.pressed;
  SWITCH.pressed = chars.some(c => Math.hypot(c.g.position.x - SWITCH.x, c.g.position.z - SWITCH.z) < SWITCH.r + 0.2);
  if(SWITCH.pressed && !wasPressed){
    const who = chars.find(c => Math.hypot(c.g.position.x - SWITCH.x, c.g.position.z - SWITCH.z) < SWITCH.r + 0.2);
    log(who.name + ' がスイッチを踏んだ。扉が開く', true);
  }
  DOOR.open += ((SWITCH.pressed ? 1 : 0) - DOOR.open) * Math.min(1, 4 * dt);
  doorMesh.position.y = 0.95 - DOOR.open * 1.8;
  switchMesh.material.color.set(SWITCH.pressed ? 0x7ddb8a : 0x9aa7b1);
}

/* ============ UI ============ */
const CAMS = {
  all:    { pos:[26,26,26],   tgt:[0,0,0] },
  center: { pos:[8,9,13],     tgt:[0,0,2] },
  slope:  { pos:[17,8,21],    tgt:[10.5,0,12.5] },
};
let camAnim = null;
function goCam(name){
  const c = CAMS[name]; if(!c) return;
  camAnim = { t:0, fromP:camera.position.clone(), fromT:controls.target.clone(),
              toP:new THREE.Vector3(...c.pos), toT:new THREE.Vector3(...c.tgt) };
  document.querySelectorAll('.cambtn').forEach(b=>b.classList.toggle('on', b.dataset.cam===name));
}
document.querySelectorAll('.cambtn').forEach(b=>b.addEventListener('click', ()=>goCam(b.dataset.cam)));
let playing = true;
const btnPlay = document.getElementById('btnPlay');
btnPlay.addEventListener('click', ()=>{
  playing = !playing;
  btnPlay.textContent = playing ? '⏸ 止める' : '▶ 再生';
  btnPlay.classList.toggle('on', playing);
});
document.getElementById('btnBall').addEventListener('click', ()=>{ resetBall(); log('玉を中央に戻しました', true); });

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const rawDt = Math.min(clock.getDelta(), 0.05);
  if(playing){
    if(winFreeze > 0){
      winFreeze -= rawDt;
      if(winFreeze <= 0){
        document.getElementById('winner').style.display = 'none';
        resetChars();
      }
    } else {
      stepGimmicks(rawDt);
      stepBall(rawDt);
      stepChars(rawDt);
    }
  }
  if(camAnim){
    camAnim.t += rawDt / 0.9;
    const e = camAnim.t >= 1 ? 1 : 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, e);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    if(camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
document.getElementById('loading').style.display = 'none';
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
log('試合開始：6人のAI選手が玉を取り合います', true);
</script>
