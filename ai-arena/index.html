<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AIアリーナ v0（ゲーム盤）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#bfe6f5; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif; }
  #scene { position:fixed; inset:0; }
  canvas { display:block; }
  .chip {
    position:fixed; top:10px; left:10px; z-index:10;
    background:rgba(255,255,255,.92); border-radius:14px; padding:8px 12px;
    box-shadow:0 2px 10px rgba(60,80,100,.18); max-width:80vw;
  }
  .chip .title { font-size:16px; font-weight:800; color:#33424f; }
  .chip .sub { font-size:11px; color:#7a8a96; margin-top:2px; line-height:1.5; }
  .chip .sub b { color:#e08a2e; }
  #score {
    position:fixed; top:10px; right:10px; z-index:10;
    background:rgba(38,50,60,.85); color:#fff; border-radius:14px; padding:8px 12px;
    font-size:12.5px; line-height:1.7; font-weight:700; min-width:118px;
  }
  #score .s-gpt { color:#e8e8e8; } #score .s-cl { color:#ffb066; } #score .s-gem { color:#a9b8ff; }
  #logbar {
    position:fixed; left:10px; right:10px; bottom:86px; z-index:10;
    background:rgba(38,50,60,.82); color:#fff; border-radius:12px;
    padding:8px 12px; font-size:13px; line-height:1.5; min-height:38px;
    display:flex; align-items:center; gap:8px;
  }
  #bar {
    position:fixed; left:0; right:0; bottom:0; z-index:11;
    padding:10px 10px calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    background:linear-gradient(to top, rgba(255,255,255,.85), rgba(255,255,255,0));
  }
  #bar button {
    border:none; border-radius:999px; padding:12px 16px; font-size:14px; font-weight:700;
    background:#fff; color:#33424f; box-shadow:0 2px 8px rgba(60,80,100,.22); cursor:pointer; font-family:inherit;
  }
  #bar button.on { background:#33424f; color:#fff; }
  #bar button:active { transform:scale(.96); }
  #winner {
    position:fixed; inset:0; z-index:15; display:none; align-items:center; justify-content:center;
    pointer-events:none;
  }
  #winner .w {
    background:rgba(255,255,255,.95); border-radius:20px; padding:22px 30px; text-align:center;
    font-size:24px; font-weight:800; color:#33424f; box-shadow:0 8px 30px rgba(60,80,100,.3);
  }
  #winner .w small { display:block; font-size:13px; color:#7a8a96; margin-top:6px; font-weight:700; }
  #loading {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:#bfe6f5; color:#33424f; font-size:15px; font-weight:700;
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loading">アリーナを作っています…</div>
<div class="chip">
  <div class="title">🏟️ AIアリーナ v0</div>
  <div class="sub"><b>ゲーム盤＋AI選手のテスト版</b>です。選手は外部AIではなく、こちらで作った<b>AI選手</b>3体（速攻・守備・搦め手）。玉を自分の陣地（色のついた隅）に入れたら勝ち。</div>
</div>
<div id="score">
  <div>🏆 スコア</div>
  <div class="s-gpt">ハヤテ：<span id="sc-hayate">0</span></div>
  <div class="s-cl">ガンテツ：<span id="sc-gantetsu">0</span></div>
  <div class="s-gem">キツネ：<span id="sc-kitsune">0</span></div>
</div>
<div id="winner"><div class="w"><span id="winnerText"></span><small>玉を中央に戻します</small></div></div>
<div id="logbar"><span>📣</span><span id="logtext">ボールの行方を見守りましょう</span></div>
<div id="bar">
  <button id="btnPlay" class="on">⏸ 止める</button>
  <button id="btnBall">玉を中央へ</button>
  <button data-cam="all" class="cambtn on">全体</button>
  <button data-cam="center" class="cambtn">中央</button>
  <button data-cam="slope" class="cambtn">坂</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const container = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe6f5);
scene.fog = new THREE.Fog(0xbfe6f5, 80, 150);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 300);
camera.position.set(24, 24, 24);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.46;
controls.minDistance = 8;
controls.maxDistance = 75;

scene.add(new THREE.HemisphereLight(0xeaf7ff, 0x8fbf7a, 0.95));
const sun = new THREE.DirectionalLight(0xfff6e0, 1.6);
sun.position.set(18, 32, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -32; sun.shadow.camera.right = 32;
sun.shadow.camera.top = 32; sun.shadow.camera.bottom = -32;
scene.add(sun);

const mat = (c, o={}) => new THREE.MeshStandardMaterial({ color:c, roughness:0.9, metalness:0, ...o });
function box(w,h,d,c,x=0,y=0,z=0,parent=scene){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat(c));
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
}
function canvasTex(w,h,draw){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function textSprite(text, { fg='#33424f', font=46, scale=1 }={}){
  const cv = document.createElement('canvas'); const ctx = cv.getContext('2d');
  ctx.font = `800 ${font}px "Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif`;
  const tw = Math.ceil(ctx.measureText(text).width);
  cv.width = tw + 36; cv.height = font + 36;
  const c2 = cv.getContext('2d');
  c2.fillStyle = 'rgba(255,255,255,0.94)';
  c2.beginPath(); c2.roundRect(0,0,cv.width,cv.height,26); c2.fill();
  c2.font = `800 ${font}px "Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif`;
  c2.fillStyle = fg; c2.textBaseline='middle'; c2.textAlign='center';
  c2.fillText(text, cv.width/2, cv.height/2+2);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true }));
  sp.scale.set(cv.width/120*scale, cv.height/120*scale, 1);
  return sp;
}

/* ============ アリーナ ============ */
const ARENA = 34;               // 一辺
const HALF = ARENA / 2;         // 17
const WALL_H = 2.0;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA, ARENA), mat(0x9edb77));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
/* 中央サークル */
{
  const ring = new THREE.Mesh(new THREE.RingGeometry(2.6, 2.85, 40),
    new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.65, side:THREE.DoubleSide }));
  ring.rotation.x = -Math.PI/2; ring.position.y = 0.02; scene.add(ring);
}
/* 外壁 */
box(ARENA+1.2, WALL_H, 0.6, 0xe8e2d2, 0, WALL_H/2, -HALF-0.3);
box(ARENA+1.2, WALL_H, 0.6, 0xe8e2d2, 0, WALL_H/2,  HALF+0.3);
box(0.6, WALL_H, ARENA+1.2, 0xe8e2d2, -HALF-0.3, WALL_H/2, 0);
box(0.6, WALL_H, ARENA+1.2, 0xe8e2d2,  HALF+0.3, WALL_H/2, 0);

/* 陣地（3隅）: { key, cx, cz, color } 中心は隅から内側へ */
const BASES = [
  { key:'hayate',   name:'ハヤテ',   cx:-13.4, cz:-13.4, color:0x2aa198, size:7 },
  { key:'gantetsu', name:'ガンテツ', cx: 13.4, cz:-13.4, color:0xd94f3d, size:7 },
  { key:'kitsune',  name:'キツネ',   cx:-13.4, cz: 13.4, color:0xe0a81c, size:7 },
];
for(const b of BASES){
  const zone = new THREE.Mesh(new THREE.PlaneGeometry(b.size, b.size),
    new THREE.MeshStandardMaterial({ color:b.color, transparent:true, opacity:0.4, roughness:1 }));
  zone.rotation.x = -Math.PI/2; zone.position.set(b.cx, 0.03, b.cz);
  zone.receiveShadow = true; scene.add(zone);
  const label = textSprite(b.name + ' 陣地', { fg:'#33424f', font:40, scale:0.8 });
  label.position.set(b.cx, 3.4, b.cz); scene.add(label);
}

/* 障害壁（多め。ただし通路は広く残す）: { x, z, w, d } */
const OBSTACLES = [
  { x:-6,  z:-8,  w:6,   d:0.9 },
  { x: 7,  z:-6,  w:0.9, d:6   },
  { x: 0,  z: 1,  w:5,   d:0.9 },
  { x:-9,  z: 4,  w:0.9, d:5   },
  { x: 9,  z: 6,  w:6,   d:0.9 },
  { x: 3,  z: 11, w:0.9, d:5   },
  { x:-4,  z:-13, w:0.9, d:4   },
  { x: 12, z: -12, w:4,  d:0.9 },
  { x:-13, z: 8,  w:4,   d:0.9 },
  { x: 6,  z: -13, w:3,  d:0.9 },
];
for(const o of OBSTACLES){
  box(o.w, 1.25, o.d, 0xd9cfb8, o.x, 0.625, o.z);
  box(o.w === 0.9 ? 1.1 : o.w, 0.18, o.d === 0.9 ? 1.1 : o.d, 0xbfb096, o.x, 1.34, o.z);
}
/* 障害物との当たり判定（AABB） */
function hitObstacle(x, z, r){
  for(const o of OBSTACLES){
    const hw = o.w/2 + r, hd = o.d/2 + r;
    if(Math.abs(x - o.x) < hw && Math.abs(z - o.z) < hd) return o;
  }
  return null;
}

/* 坂（スロープ）: 見た目＝ウェッジ、効果＝範囲内では下り方向へ加速 */
const SLOPES = [
  { x: 10.5, z: 12.5, r: 4.2, dirX: -0.55, dirZ: -0.85, h: 1.1 },  // 南東の坂：北西へ下る
  { x: -2,   z: -5.5, r: 3.4, dirX: 0.3,   dirZ: 0.95,  h: 0.9 },  // 中央北の坂：南へ下る
];
for(const s of SLOPES){
  const shape = new THREE.Shape();
  shape.moveTo(-3.4, 0); shape.lineTo(3.4, 0); shape.lineTo(3.4, s.h); shape.lineTo(-3.4, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 4.6, bevelEnabled: false });
  geo.translate(0, 0, -2.3);
  const m = new THREE.Mesh(geo, mat(0xd8cdb4));
  m.position.set(s.x, 0, s.z);
  m.rotation.y = Math.atan2(s.dirX, s.dirZ) + Math.PI/2;
  m.castShadow = true; m.receiveShadow = true; scene.add(m);
}

/* ============ 玉 ============ */
const BALL_R = 0.85;
const ballTex = canvasTex(256, 128, (c)=>{
  c.fillStyle = '#f7f5ef'; c.fillRect(0,0,256,128);
  c.fillStyle = '#2aa198'; c.fillRect(0,0,42,128);
  c.fillStyle = '#d94f3d'; c.fillRect(85,0,42,128);
  c.fillStyle = '#e0a81c'; c.fillRect(170,0,42,128);
});
const ball = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 26, 20),
  new THREE.MeshStandardMaterial({ map:ballTex, roughness:0.45 }));
ball.castShadow = true; scene.add(ball);
const ballState = { x:0, z:6.5, vx:0, vz:0 };
function resetBall(x=2.5, z=3.5){ ballState.x = x; ballState.z = z; ballState.vx = 0; ballState.vz = 0; }
resetBall();

/* ============ キャラクター ============ */
const CH = 1.7;
const PLAYER_STYLE = {
  hayate:   { color:0x2aa198, fg:'#1d7a72', speed:3.9, push:17, scale:1.0 },
  gantetsu: { color:0xd94f3d, fg:'#b03424', speed:3.0, push:15, scale:1.13 },
  kitsune:  { color:0xe0a81c, fg:'#a87c10', speed:3.45, push:14, scale:0.97 },
};
function makeCharacter(kind){
  const st = PLAYER_STYLE[kind];
  const g = new THREE.Group();
  const bodyGeo = new THREE.SphereGeometry(0.55, 26, 20);
  const b = new THREE.Mesh(bodyGeo, mat(st.color, { roughness:0.6 }));
  b.scale.set(st.scale, 1.28 * st.scale, st.scale); b.position.y = 0.86 * st.scale; b.castShadow = true; g.add(b);
  const armMat = mat(st.color, { roughness:0.6 });
  for(const s of [-1, 1]){
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.3, 4, 10), armMat);
    arm.position.set(0.6*s*st.scale, 0.82*st.scale, 0); arm.rotation.z = 0.3*s; arm.castShadow = true; g.add(arm);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), armMat);
    foot.scale.set(1, 0.55, 1.25); foot.position.set(0.21*s, 0.09, 0.05); g.add(foot);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), mat(0x26221f, { roughness:0.35 }));
    eye.position.set(0.19*s, (1.22 + (st.scale-1)) * (kind === 'kitsune' ? 0.98 : 1), 0.5 * st.scale + 0.02); g.add(eye);
  }
  if(kind === 'kitsune'){
    for(const s of [-1, 1]){
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.32, 4), armMat);
      ear.position.set(0.24*s, 1.72, 0); ear.rotation.z = -0.25*s; ear.castShadow = true; g.add(ear);
    }
  }
  const names = { hayate:'ハヤテ', gantetsu:'ガンテツ', kitsune:'キツネ' };
  const label = textSprite(names[kind], { fg:st.fg, scale:0.95 });
  label.position.y = CH + 0.5; g.add(label);
  scene.add(g);
  return { kind, g, name:names[kind], speed:st.speed, push:st.push, mode:'attack', jitter:0, jx:0, jz:0 };
}
const chars = [ makeCharacter('hayate'), makeCharacter('gantetsu'), makeCharacter('kitsune') ];
const STARTS = { hayate:[-11,-11], gantetsu:[11,-11], kitsune:[-11,11] };
function resetChars(){
  for(const c of chars){
    const [x, z] = STARTS[c.kind];
    c.g.position.set(x, 0, z);
  }
}
resetChars();
const baseOf = (kind) => BASES.find(b => b.key === kind);

/* ============ ログ ============ */
const logtext = document.getElementById('logtext');
let lastLog = '', lastLogAt = 0;
function log(msg, force=false){
  const now = performance.now();
  if(!force && (msg === lastLog || now - lastLogAt < 900)) return;
  lastLog = msg; lastLogAt = now;
  logtext.textContent = msg;
}

/* ============ 物理とデモAI ============ */
const scores = { hayate:0, gantetsu:0, kitsune:0 };
let winFreeze = 0;
function declareWin(base){
  scores[base.key]++;
  document.getElementById('sc-' + base.key).textContent = scores[base.key];
  document.getElementById('winnerText').textContent = '🏆 ' + base.name + ' の陣地に入った！';
  document.getElementById('winner').style.display = 'flex';
  log(base.name + ' が玉を自陣に入れました', true);
  winFreeze = 2.6;
}
function stepBall(dt){
  const b = ballState;
  for(const s of SLOPES){
    if(Math.hypot(b.x - s.x, b.z - s.z) < s.r){
      b.vx += s.dirX * 2.4 * dt; b.vz += s.dirZ * 2.4 * dt;
    }
  }
  const fr = Math.exp(-1.1 * dt);
  b.vx *= fr; b.vz *= fr;
  b.x += b.vx * dt; b.z += b.vz * dt;
  const lim = HALF - BALL_R;
  if(b.x < -lim){ b.x = -lim; b.vx = Math.abs(b.vx) * 0.55; }
  if(b.x >  lim){ b.x =  lim; b.vx = -Math.abs(b.vx) * 0.55; }
  if(b.z < -lim){ b.z = -lim; b.vz = Math.abs(b.vz) * 0.55; }
  if(b.z >  lim){ b.z =  lim; b.vz = -Math.abs(b.vz) * 0.55; }
  const o = hitObstacle(b.x, b.z, BALL_R * 0.92);
  if(o){
    const dx = b.x - o.x, dz = b.z - o.z;
    const px = (o.w/2 + BALL_R * 0.92) - Math.abs(dx);
    const pz = (o.d/2 + BALL_R * 0.92) - Math.abs(dz);
    if(px < pz){ b.x = o.x + Math.sign(dx) * (o.w/2 + BALL_R * 0.92); b.vx = -b.vx * 0.5; }
    else       { b.z = o.z + Math.sign(dz) * (o.d/2 + BALL_R * 0.92); b.vz = -b.vz * 0.5; }
  }
  ball.position.set(b.x, BALL_R, b.z);
  ball.rotation.x += b.vz * dt / BALL_R;
  ball.rotation.z -= b.vx * dt / BALL_R;
  for(const base of BASES){
    if(Math.abs(b.x - base.cx) < base.size/2 && Math.abs(b.z - base.cz) < base.size/2){
      declareWin(base);
      resetBall();
      break;
    }
  }
}
function moveChar(c, tx, tz, dt){
  const p = c.g.position;
  let dx = tx - p.x, dz = tz - p.z;
  const dist = Math.hypot(dx, dz);
  if(dist < 0.05) return;
  dx /= dist; dz /= dist;
  /* 障害物の回避：近くの壁から離れる力を足す */
  for(const o of OBSTACLES){
    const ox = p.x - o.x, oz = p.z - o.z;
    const nearX = Math.max(Math.abs(ox) - o.w/2, 0), nearZ = Math.max(Math.abs(oz) - o.d/2, 0);
    const d = Math.hypot(nearX, nearZ);
    if(d < 1.6 && (nearX > 0 || nearZ > 0)){
      dx += (ox >= 0 ? 1 : -1) * (nearX > nearZ ? 0.9 : 0.25);
      dz += (oz >= 0 ? 1 : -1) * (nearZ >= nearX ? 0.9 : 0.25);
    }
  }
  /* 他キャラとの間隔 */
  for(const o of chars){
    if(o === c) continue;
    const ox = p.x - o.g.position.x, oz = p.z - o.g.position.z;
    const d = Math.hypot(ox, oz);
    if(d > 0.01 && d < 1.3){ dx += ox/d * 0.7; dz += oz/d * 0.7; }
  }
  const dl = Math.hypot(dx, dz); dx /= dl; dz /= dl;
  const step = Math.min(c.speed * dt, dist);
  let nx = p.x + dx * step, nz = p.z + dz * step;
  const lim = HALF - 0.6;
  nx = Math.max(-lim, Math.min(lim, nx)); nz = Math.max(-lim, Math.min(lim, nz));
  if(!hitObstacle(nx, nz, 0.55)){ p.x = nx; p.z = nz; }
  else if(!hitObstacle(nx, p.z, 0.55)){ p.x = nx; }
  else if(!hitObstacle(p.x, nz, 0.55)){ p.z = nz; }
  c.g.rotation.y = Math.atan2(dx, dz);
  p.y = Math.abs(Math.sin(performance.now() * 0.011)) * 0.05;
}
let ballStillTime = 0;
const distToBase = (b, base) => Math.hypot(b.x - base.cx, b.z - base.cz);
function stepChars(dt){
  const b = ballState;
  const speed = Math.hypot(b.vx, b.vz);
  ballStillTime = speed < 0.25 ? ballStillTime + dt : 0;
  for(const c of chars){
    c.jitter -= dt;
    if(c.jitter <= 0){ c.jitter = 2.5 + Math.random() * 2; c.jx = (Math.random()-0.5) * 2.4; c.jz = (Math.random()-0.5) * 2.4; }
    const base = baseOf(c.kind);
    const p = c.g.position;
    let standX, standZ, mode = 'attack';

    if(c.kind === 'gantetsu'){
      /* 守備型：自陣より相手の陣地に玉が近い時は、その相手の進路を塞ぎにいく */
      let threat = null, threatDist = 1e9;
      for(const ob of BASES){
        if(ob.key === c.kind) continue;
        const d = distToBase(b, ob);
        if(d < threatDist){ threatDist = d; threat = ob; }
      }
      if(threat && threatDist < distToBase(b, base) - 1.5){
        mode = 'block';
        let fx = threat.cx - b.x, fz = threat.cz - b.z;
        const fl = Math.hypot(fx, fz) || 1; fx /= fl; fz /= fl;
        standX = b.x + fx * (BALL_R + 0.55); standZ = b.z + fz * (BALL_R + 0.55);
        if(c.mode !== 'block') log('ガンテツ：' + threat.name + 'の攻めを警戒、進路を塞ぎにいく');
      }
    }
    if(c.kind === 'kitsune'){
      /* 搦め手：相手の陣地ギリギリの玉はかっさらう。通常時は斜めから当てる */
      let danger = null;
      for(const ob of BASES){
        if(ob.key === c.kind) continue;
        if(distToBase(b, ob) < 4.4){ danger = ob; break; }
      }
      if(danger){
        mode = 'steal';
        let ax = b.x - danger.cx, az = b.z - danger.cz;
        const al = Math.hypot(ax, az) || 1; ax /= al; az /= al;
        standX = b.x - ax * (BALL_R + 0.62); standZ = b.z - az * (BALL_R + 0.62);
        if(c.mode !== 'steal') log('キツネ：' + danger.name + 'の目前の玉をかっさらいに来た');
      }
    }
    if(mode === 'attack'){
      let ax = b.x - base.cx, az = b.z - base.cz;
      const al = Math.hypot(ax, az) || 1; ax /= al; az /= al;
      standX = b.x + ax * (BALL_R + 0.62); standZ = b.z + az * (BALL_R + 0.62);
      if(c.kind === 'kitsune'){
        /* 斜め当て：立ち位置を横へずらして玉に角度をつける */
        standX += -az * 0.85; standZ += ax * 0.85;
      }
    }
    c.mode = mode;

    const dStand = Math.hypot(standX - p.x, standZ - p.z);
    const dBall = Math.hypot(b.x - p.x, b.z - p.z);
    if(dStand > 0.55){
      moveChar(c, standX + (ballStillTime > 4 ? c.jx : 0), standZ + (ballStillTime > 4 ? c.jz : 0), dt);
    } else {
      moveChar(c, b.x, b.z, dt);
    }
    /* 玉との接触＝押す */
    if(dBall < BALL_R + 0.62){
      let px = b.x - p.x, pz = b.z - p.z;
      const pl = Math.hypot(px, pz) || 1; px /= pl; pz /= pl;
      b.vx += px * c.push * dt; b.vz += pz * c.push * dt;
      const sp = Math.hypot(b.vx, b.vz), max = 9.5;
      if(sp > max){ b.vx *= max/sp; b.vz *= max/sp; }
      log(c.name + ' が玉を押している');
    }
  }
}

/* ============ UI ============ */
const CAMS = {
  all:    { pos:[24,24,24],   tgt:[0,0,0] },
  center: { pos:[8,9,13],     tgt:[0,0,2] },
  slope:  { pos:[17,8,21],    tgt:[10.5,0,12.5] },
};
let camAnim = null;
function goCam(name){
  const c = CAMS[name]; if(!c) return;
  camAnim = { t:0, fromP:camera.position.clone(), fromT:controls.target.clone(),
              toP:new THREE.Vector3(...c.pos), toT:new THREE.Vector3(...c.tgt) };
  document.querySelectorAll('.cambtn').forEach(b=>b.classList.toggle('on', b.dataset.cam===name));
}
document.querySelectorAll('.cambtn').forEach(b=>b.addEventListener('click', ()=>goCam(b.dataset.cam)));
let playing = true;
const btnPlay = document.getElementById('btnPlay');
btnPlay.addEventListener('click', ()=>{
  playing = !playing;
  btnPlay.textContent = playing ? '⏸ 止める' : '▶ 再生';
  btnPlay.classList.toggle('on', playing);
});
document.getElementById('btnBall').addEventListener('click', ()=>{ resetBall(); log('玉を中央に戻しました', true); });

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const rawDt = Math.min(clock.getDelta(), 0.05);
  if(playing){
    if(winFreeze > 0){
      winFreeze -= rawDt;
      if(winFreeze <= 0){
        document.getElementById('winner').style.display = 'none';
        resetChars();
      }
    } else {
      stepBall(rawDt);
      stepChars(rawDt);
    }
  }
  if(camAnim){
    camAnim.t += rawDt / 0.9;
    const e = camAnim.t >= 1 ? 1 : 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.fromP, camAnim.toP, e);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    if(camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
document.getElementById('loading').style.display = 'none';
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
log('ゲーム盤テスト開始：3体が玉を自陣へ運びます', true);
</script>
